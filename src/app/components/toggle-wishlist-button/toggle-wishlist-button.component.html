<button
  class="!bg-white shadow-md w-10 h-10 p-2 rounded transition-all duration-200 hover:scale-110 hover:shadow-lg"
  [class]=" isInWishlist() ? '!text-red-500' : '!text-gray-400'" matIconButton (click)="toggleWishlist(product())">
  <mat-icon>{{isInWishlist() ? 'favorite' : 'favorite_border'}}</mat-icon>
</button>
