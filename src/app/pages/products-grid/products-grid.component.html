<mat-sidenav-container>
  <mat-sidenav mode="side" opened="true">
    <div class="p-6">
      <h2 class="text-lg text-gray-900">Category</h2>
      <mat-nav-list>
        @for (cat of categories(); track cat) {
          <mat-list-item [activated]="cat === category()" [routerLink]="['/products', cat]">
            <span matListItemTitle class="font-medium" [class]="cat === category() ? '!text-white' : null">
              {{ cat | titlecase}}
            </span>
          </mat-list-item>
        }
      </mat-nav-list>
    </div>
  </mat-sidenav>
  <mat-sidenav-content class="bg-gray-100 p-6 h-full">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">{{ category() | titlecase}}</h1>
    <p class="text-base text-gray-600 mb-6"> {{ `${store.filteredProduct().length} products found` }} </p>
    <div class="responsive-grid">
      @for (product of store.filteredProduct(); track product.id) {
        <app-product-card [product]="product">
          <app-toggle-wishlist-button [style.view-transition-name]="'wishlist-button-'+ product.id" class="!absolute z-10 top-3 right-3 !bg-white shadow-md w-10 h-10 p-2 rounded transition-all duration-200 hover:scale-110 hover:shadow-lg" [product]="product"/>
        </app-product-card>
      }
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
